[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2script"
version = "0.1.0"
description = "使用单一视觉 agent 将长视频转换为演员剧本"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60,<4", "httpx>=0.27,<1", "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2", "oss2>=2.19,<3",
  "tiktoken>=0.9,<1", "srt>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vid2script = "vid2script.cli:main"

[tool.setuptools.packages.find]
include = ["vid2script*"]

[tool.setuptools.package-data]
vid2script = ["prompts/*.md"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.work/pytest"
